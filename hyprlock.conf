# colors: your palette
$fg = rgb(223, 223, 224)
$bg = rgb(5, 4, 2)
$wall = /home/andersroum/.config/hypr/wallpapers/mono-mountains.jpg

general {
    grace = 1
}

background {
    monitor =
    path = $wall
    blur_size = 5
    blur_passes = 1
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = $fg
    inner_color = $bg
    font_color = $fg
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, 200
    halign = center
    valign = bottom
}

#date
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%A, %-d %B %Y')" </b>"
    color = $fg
    font_size = 34
    font_family = JetBrainsMono Nerd Font
    position = 0, -150
    halign = center
    valign = top
}

#time
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H:%M:%S") </big></b>"
    color = $fg
    font_size = 94
    font_family = JetBrainsMono Nerd Font
    position = 0, 0
    halign = center
    valign = center
}

#user
label {
    monitor =
    text = $USER
    color = $fg
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = bottom
}

#uptime
label {
    monitor =
    text = cmd[update:60000] echo "<b> "$(uptime -p)" </b>"
    color = $fg
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 0, 0
    halign = right
    valign = bottom
}

#picture (wallpaper)
image {
    monitor =
    path = $wall
    size = 230
    rounding = -1
    border_size = 2
    border_color = $fg
    rotate = 0
    reload_time = -1
    position = 0, 300
    halign = center
    valign = bottom
}
